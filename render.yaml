# Render.com one-click deployment manifest.
# Push to a branch GitHub repo + click "New → Blueprint" on Render, point at
# this file, and Render provisions the service automatically.
#
# Free tier notes:
#   - Service sleeps after 15 min idle; first request after sleep takes
#     ~30 sec to wake up.
#   - 750 service-hours / month free, enough for one always-deployable app.
#   - Persistent disk costs extra; we use ephemeral storage for
#     static/models/generated/ since it gets regenerated.

services:
  - type: web
    name: autohub
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 90
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: TRIPO_API_KEY
        sync: false        # set per-environment in Render dashboard
      - key: NEWS_API_KEY
        sync: false        # set per-environment in Render dashboard
      - key: FLASK_DEBUG
        value: "0"