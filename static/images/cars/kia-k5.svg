<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="2024 Kia K5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f24"/>
      <stop offset="1" stop-color="#0a0c0e"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".97"/>
      <stop offset="1" stop-color="#cfd6de" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="carGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bb162b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0b0f17" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#bb162b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#bb162b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>

  <!-- decorative speed stripes -->
  <g opacity="0.07" fill="#ffffff">
    <polygon points="-200,600 200,0 320,0 -80,600"/>
    <polygon points="60,600 460,0 520,0 120,600"/>
  </g>
  <circle cx="1230" cy="150" r="240" fill="#ffffff" opacity="0.04"/>

  <!-- accent ground line -->
  <rect x="0" y="520" width="1600" height="4" fill="#bb162b" opacity="0.55"/>

  <!-- car -->
  <g transform="translate(540,150) scale(1.0)">
    <ellipse cx="500" cy="372" rx="430" ry="26" fill="rgba(0,0,0,.35)"/>
    <circle cx="250" cy="300" r="56" fill="rgba(0,0,0,.55)"/><circle cx="250" cy="300" r="38" fill="rgba(255,255,255,.18)"/><circle cx="250" cy="300" r="15" fill="rgba(0,0,0,.5)"/><circle cx="760" cy="300" r="56" fill="rgba(0,0,0,.55)"/><circle cx="760" cy="300" r="38" fill="rgba(255,255,255,.18)"/><circle cx="760" cy="300" r="15" fill="rgba(0,0,0,.5)"/><path d="M60,300 L60,252 Q62,240 86,237 L210,232 L300,178 L470,168 L640,170 L740,232 L880,240 Q930,246 936,276 L936,300 Z" fill="url(#carBody)"/><path d="M322,182 L470,176 L632,178 L716,228 L360,230 Z" fill="url(#carGlass)"/>
  </g>

  <!-- text block -->
  <text x="90" y="150" fill="#bb162b" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="34" font-weight="700" letter-spacing="8">KIA</text>
  <text x="86" y="250" fill="#ffffff" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="94" font-weight="800" letter-spacing="-2">K5</text>
  <rect x="92" y="276" width="120" height="6" fill="#bb162b"/>
  <g transform="translate(92,318)">
    <rect x="0" y="-26" rx="6" ry="6" width="120" height="40"
          fill="rgba(255,255,255,.10)" stroke="#bb162b" stroke-opacity=".6"/>
    <text x="18" y="1" fill="#ffffff" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="20" font-weight="700" letter-spacing="3">SEDAN</text>
  </g>
  <text x="94" y="400" fill="#ffffff" fill-opacity=".82"
        font-family="'Helvetica Neue',Arial,sans-serif" font-size="26"
        font-weight="600" letter-spacing="1">191 hp   •   7.8 sec   •   $27,900</text>

  <!-- watermark -->
  <text x="1560" y="566" text-anchor="end" fill="#ffffff" fill-opacity=".28"
        font-family="'Helvetica Neue',Arial,sans-serif" font-size="22"
        font-weight="800" letter-spacing="4">AUTOHUB</text>
</svg>
