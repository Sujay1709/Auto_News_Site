server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Hashed build assets are immutable — cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves index.html so React Router
    # handles client-side routes (/cars, /news, /info, /compare, /cars/:slug).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
