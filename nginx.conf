server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Hashed build assets are immutable — cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the AI agent so the SPA calls it same-origin at /agent/*.
    # This keeps the agent URL out of the client bundle and avoids CORS
    # entirely. The trailing slash on proxy_pass rewrites /agent/chat -> /chat.
    # Cloud Run needs SNI + the run.app Host header to route to the service.
    location /agent/ {
        proxy_pass https://autohub-agent-xhgcy2euza-uc.a.run.app/;
        proxy_ssl_server_name on;
        proxy_set_header Host autohub-agent-xhgcy2euza-uc.a.run.app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # SPA fallback: every unknown path serves index.html so React Router
    # handles client-side routes (/cars, /news, /info, /compare, /cars/:slug).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
